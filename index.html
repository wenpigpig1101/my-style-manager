```html
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>品牌款式雲端圖庫</title>
  
  <!-- 引入 Tailwind CSS (負責畫面排版與顏色) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 React 與 ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel (用來讓瀏覽器看得懂 React JSX 語法) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 引入 Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

    // 將 Firebase 模組掛載到全域變數
    window.Firebase = {
      initializeApp, getAuth, signInAnonymously, onAuthStateChanged,
      getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, serverTimestamp
    };
  </script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // 您的專屬 Firebase 設定 (已為您填寫完畢)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyC21hAa9T6RpYxcVbP9zgihtN-HqiYH_pM",
      authDomain: "my-style-app-d7654.firebaseapp.com",
      projectId: "my-style-app-d7654",
      storageBucket: "my-style-app-d7654.firebasestorage.app",
      messagingSenderId: "909202422105",
      appId: "1:909202422105:web:48798f0b02a9509457b448",
      measurementId: "G-BSTPK7SW9M"
    };

    const categories = ['全部', '上衣', '褲子', '洋裝', '外套', '裙子', '配件'];

    function App() {
      const [app, setApp] = useState(null);
      const [auth, setAuth] = useState(null);
      const [db, setDb] = useState(null);
      
      const [user, setUser] = useState(null);
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      
      const [searchQuery, setSearchQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState('全部');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isAdding, setIsAdding] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      
      const [newProduct, setNewProduct] = useState({
        styleId: '', name: '', category: '上衣', color: '', season: '', material: '', imageUrl: '', description: ''
      });

      // 初始化 Firebase
      useEffect(() => {
        const initInterval = setInterval(() => {
          if (window.Firebase) {
            clearInterval(initInterval);
            try {
              const firebaseApp = window.Firebase.initializeApp(firebaseConfig);
              const firebaseAuth = window.Firebase.getAuth(firebaseApp);
              const firestoreDb = window.Firebase.getFirestore(firebaseApp);
              
              setApp(firebaseApp);
              setAuth(firebaseAuth);
              setDb(firestoreDb);

              // 匿名登入
              window.Firebase.signInAnonymously(firebaseAuth).catch(err => {
                console.error("登入失敗:", err);
                setError("無法連線至雲端系統，請檢查是否已在 Firebase 開啟「匿名登入」。");
                setLoading(false);
              });

              window.Firebase.onAuthStateChanged(firebaseAuth, (currentUser) => {
                setUser(currentUser);
              });
            } catch (err) {
               console.error("Firebase 初始化失敗:", err);
               setError("資料庫連線失敗，請檢查設定檔。");
               setLoading(false);
            }
          }
        }, 100);
        return () => clearInterval(initInterval);
      }, []);

      // 監聽雲端資料
      useEffect(() => {
        if (!user || !db) return;

        const stylesRef = window.Firebase.collection(db, 'styles');
        
        const unsubscribe = window.Firebase.onSnapshot(stylesRef, (snapshot) => {
          const stylesData = [];
          snapshot.forEach((doc) => {
            stylesData.push({ id: doc.id, ...doc.data() });
          });
          
          stylesData.sort((a, b) => {
            const timeA = a.createdAt?.toMillis() || 0;
            const timeB = b.createdAt?.toMillis() || 0;
            return timeB - timeA;
          });
          
          setProducts(stylesData);
          setLoading(false);
          setError(null);
        }, (err) => {
          console.error("讀取資料失敗:", err);
          setError("讀取雲端資料失敗，請確認是否已建立 Firestore 並設定為「測試模式」。");
          setLoading(false);
        });

        return () => unsubscribe();
      }, [user, db]);

      // 搜尋與篩選
      const filteredProducts = useMemo(() => {
        return products.filter(product => {
          const matchCategory = activeCategory === '全部' || product.category === activeCategory;
          const query = searchQuery.toLowerCase();
          const matchSearch = 
            (product.styleId || '').toLowerCase().includes(query) || 
            (product.name || '').toLowerCase().includes(query) ||
            (product.color || '').toLowerCase().includes(query) ||
            (product.season || '').toLowerCase().includes(query);
          return matchCategory && matchSearch;
        });
      }, [products, searchQuery, activeCategory]);

      // 新增資料
      const handleAddProduct = async (e) => {
        e.preventDefault();
        if (!newProduct.styleId || !newProduct.name || !user || !db) return;
        
        setIsSubmitting(true);
        try {
          const stylesRef = window.Firebase.collection(db, 'styles');
          await window.Firebase.addDoc(stylesRef, {
            ...newProduct,
            imageUrl: newProduct.imageUrl || 'https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&q=80&w=400',
            createdAt: window.Firebase.serverTimestamp(),
            createdBy: user.uid
          });
          
          setIsAdding(false);
          setNewProduct({ styleId: '', name: '', category: '上衣', color: '', season: '', material: '', imageUrl: '', description: '' });
        } catch (err) {
          console.error("新增失敗:", err);
          alert("新增失敗，請檢查權限或連線狀態");
        } finally {
          setIsSubmitting(false);
        }
      };

      // 刪除資料
      const [itemToDelete, setItemToDelete] = useState(null);
      const confirmDelete = async () => {
        if(!itemToDelete || !db) return;
        try {
          await window.Firebase.deleteDoc(window.Firebase.doc(db, 'styles', itemToDelete));
          setItemToDelete(null);
          setSelectedProduct(null);
        } catch (err) {
          console.error("刪除失敗:", err);
          alert("刪除失敗");
        }
      };

      // --- UI Icon 元件 ---
      const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
      const IconSearch = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
      const IconPackage = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>;
      const IconX = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
      const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
      const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;

      return (
        <div className="min-h-screen flex flex-col font-sans text-gray-800">
          <header className="bg-white shadow-sm sticky top-0 z-10">
            <div className="max-w-7xl mx-auto px-4 py-3">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div className="flex items-center gap-2 text-indigo-600">
                  <IconPackage />
                  <h1 className="text-xl font-bold text-gray-900 tracking-wide">品牌款式雲端圖庫</h1>
                </div>
                
                <div className="flex-1 max-w-2xl relative">
                  <div className="relative flex items-center">
                    <div className="absolute left-3 text-gray-400"><IconSearch /></div>
                    <input 
                      type="text" 
                      placeholder="輸入款式編號、關鍵字、顏色查詢..." 
                      className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                    />
                  </div>
                </div>

                <button 
                  onClick={() => setIsAdding(true)}
                  disabled={!!error || loading}
                  className="flex items-center justify-center gap-2 bg-indigo-600 text-white px-5 py-2.5 rounded-xl hover:bg-indigo-700 font-medium disabled:bg-gray-300"
                >
                  <IconPlus /> 新增款式
                </button>
              </div>
              
              <div className="flex overflow-x-auto gap-2 mt-4 pb-1 scrollbar-hide">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setActiveCategory(cat)}
                    className={`px-4 py-1.5 rounded-full whitespace-nowrap text-sm font-medium border transition-colors ${
                      activeCategory === cat ? 'bg-indigo-100 text-indigo-700 border-indigo-200' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl mx-auto px-4 py-8 w-full">
            {error ? (
              <div className="text-center py-20 bg-red-50 rounded-2xl border border-red-100 max-w-2xl mx-auto p-6 shadow-sm">
                <h3 className="text-lg font-bold text-red-800 mb-2">無法讀取資料</h3>
                <p className="text-red-600 font-medium text-sm break-all">{error}</p>
                <p className="mt-4 text-sm text-gray-600">請回 Firebase 後台確認：1. Firestore 是否建立且設為測試模式。 2. Authentication 中是否啟用匿名登入。</p>
              </div>
            ) : loading ? (
              <div className="text-center py-32 text-gray-500">正在連接您的專屬資料庫...</div>
            ) : filteredProducts.length === 0 ? (
              <div className="text-center py-24 bg-white rounded-2xl border border-gray-200 shadow-sm">
                <IconPackage className="mx-auto h-12 w-12 text-gray-300 mb-4" />
                <h3 className="text-lg font-medium text-gray-900">資料庫目前是空的</h3>
                <p className="mt-2 text-gray-500">恭喜！連線成功，點擊右上角「新增款式」開始建立圖庫。</p>
              </div>
            ) : (
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 sm:gap-6">
                {filteredProducts.map(product => (
                  <div 
                    key={product.id} 
                    className="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 cursor-pointer flex flex-col hover:shadow-md transition-shadow group"
                    onClick={() => setSelectedProduct(product)}
                  >
                    <div className="relative aspect-[3/4] bg-gray-100 overflow-hidden">
                      <img src={product.imageUrl} alt={product.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onError={(e) => e.target.src = 'https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&q=80&w=400'}/>
                      {product.season && <div className="absolute top-2 right-2 bg-black/60 text-white text-xs px-2 py-1 rounded backdrop-blur-sm">{product.season}</div>}
                    </div>
                    <div className="p-3 sm:p-4 flex-1 flex flex-col">
                      <div className="text-xs font-mono text-indigo-600 mb-1 font-bold tracking-wide">{product.styleId}</div>
                      <h3 className="font-medium text-sm sm:text-base line-clamp-2 mb-2 leading-tight">{product.name}</h3>
                      <div className="text-xs text-gray-500 mt-auto flex justify-between items-center">
                        <span className="truncate pr-1">{product.color}</span>
                        <span className="bg-gray-100 px-2 py-0.5 rounded text-[10px] sm:text-xs">{product.category}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* 產品詳細資訊 Modal */}
          {selectedProduct && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-2 sm:p-6 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-4xl w-full max-h-[95vh] overflow-hidden flex flex-col md:flex-row relative shadow-2xl">
                <button onClick={() => setSelectedProduct(null)} className="absolute top-3 right-3 bg-black/50 text-white hover:bg-black p-1.5 rounded-full z-10 md:bg-white/80 md:text-gray-700 md:hover:bg-gray-100"><IconX /></button>
                
                <div className="md:w-1/2 h-[45vh] md:h-auto bg-gray-100 relative">
                  <img src={selectedProduct.imageUrl} alt={selectedProduct.name} className="w-full h-full object-cover" onError={(e) => e.target.src = 'https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&q=80&w=400'}/>
                </div>

                <div className="md:w-1/2 p-5 md:p-8 overflow-y-auto">
                  <div className="flex items-center gap-3 text-emerald-800 bg-emerald-50 p-4 rounded-xl mb-5 border border-emerald-200">
                    <IconCheck className="text-emerald-500 shrink-0"/>
                    <div>
                      <div className="font-bold text-lg">確認為本公司商品</div>
                      <div className="text-sm opacity-80">系統建檔款式，可安心處理</div>
                    </div>
                  </div>

                  <span className="text-sm font-medium text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">{selectedProduct.category}</span>
                  <h2 className="text-2xl font-bold mt-3 mb-2 leading-tight">{selectedProduct.name}</h2>
                  <div className="font-mono text-lg font-bold tracking-wider bg-gray-100 text-gray-700 px-3 py-1 rounded-lg inline-block mb-6">{selectedProduct.styleId}</div>

                  <div className="grid grid-cols-2 gap-x-4 gap-y-5 text-sm mb-6">
                    <div><span className="text-gray-400 block text-xs mb-1">顏色</span><span className="font-medium">{selectedProduct.color || '未填寫'}</span></div>
                    <div><span className="text-gray-400 block text-xs mb-1">季別/年份</span><span className="font-medium">{selectedProduct.season || '未填寫'}</span></div>
                    <div className="col-span-2"><span className="text-gray-400 block text-xs mb-1">材質</span><span className="font-medium">{selectedProduct.material || '未填寫'}</span></div>
                  </div>

                  <div className="border-t border-gray-100 pt-4 mt-2">
                    <div className="text-sm font-medium text-gray-600 mb-2">辨識特徵描述 (防偽重點)</div>
                    <div className="bg-amber-50/50 border border-amber-100 p-4 rounded-xl text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">{selectedProduct.description || '無描述'}</div>
                  </div>
                  
                  <div className="mt-8 flex gap-3">
                    <button onClick={() => setItemToDelete(selectedProduct.id)} className="p-3 text-red-500 bg-red-50 rounded-xl hover:bg-red-100 flex items-center justify-center"><IconTrash /></button>
                    <button onClick={() => setSelectedProduct(null)} className="flex-1 bg-gray-900 text-white py-3 rounded-xl font-medium shadow-md hover:bg-gray-800">確認完畢，關閉</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 刪除確認 Modal */}
          {itemToDelete && (
            <div className="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                <h3 className="font-bold text-lg text-gray-900 mb-2">確定要刪除嗎？</h3>
                <p className="text-gray-500 text-sm mb-6">刪除後所有員工將無法再查詢到此款式，且動作無法復原。</p>
                <div className="flex gap-3">
                  <button onClick={() => setItemToDelete(null)} className="flex-1 py-2 bg-gray-100 text-gray-700 font-medium rounded-xl hover:bg-gray-200">取消</button>
                  <button onClick={confirmDelete} className="flex-1 py-2 bg-red-500 text-white font-medium rounded-xl hover:bg-red-600">確認刪除</button>
                </div>
              </div>
            </div>
          )}

          {/* 新增表單 Modal */}
          {isAdding && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-end p-0 sm:p-4 backdrop-blur-sm">
              <div className="bg-white w-full max-w-md h-full sm:h-auto sm:max-h-[90vh] sm:rounded-2xl flex flex-col shadow-2xl">
                <div className="flex justify-between items-center p-5 border-b border-gray-100 bg-indigo-50/50 sm:rounded-t-2xl">
                  <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2"><IconPlus /> 新增款式建檔</h2>
                  <button onClick={() => setIsAdding(false)} className="text-gray-400 hover:text-gray-700 bg-white p-1 rounded-full shadow-sm"><IconX /></button>
                </div>
                
                <div className="p-6 overflow-y-auto flex-1">
                  <form id="addForm" onSubmit={handleAddProduct} className="space-y-4">
                    <div><label className="text-sm font-medium text-gray-700 block mb-1">款式編號/貨號 <span className="text-red-500">*</span></label><input required type="text" placeholder="例如: T24-001" className="w-full p-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 font-mono" value={newProduct.styleId} onChange={e => setNewProduct({...newProduct, styleId: e.target.value.toUpperCase()})} /></div>
                    <div><label className="text-sm font-medium text-gray-700 block mb-1">商品名稱 <span className="text-red-500">*</span></label><input required type="text" placeholder="例如: 經典白T" className="w-full p-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" value={newProduct.name} onChange={e => setNewProduct({...newProduct, name: e.target.value})} /></div>
                    <div className="grid grid-cols-2 gap-4">
                      <div><label className="text-sm font-medium text-gray-700 block mb-1">大分類</label><select className="w-full p-2.5 border border-gray-300 rounded-lg bg-white outline-none focus:ring-2 focus:ring-indigo-500" value={newProduct.category} onChange={e => setNewProduct({...newProduct, category: e.target.value})}>{categories.filter(c=>c!=='全部').map(c=><option key={c}>{c}</option>)}</select></div>
                      <div><label className="text-sm font-medium text-gray-700 block mb-1">年份/季別</label><input type="text" placeholder="如: 2024 春夏" className="w-full p-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" value={newProduct.season} onChange={e => setNewProduct({...newProduct, season: e.target.value})} /></div>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <div><label className="text-sm font-medium text-gray-700 block mb-1">顏色</label><input type="text" placeholder="如: 白色" className="w-full p-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" value={newProduct.color} onChange={e => setNewProduct({...newProduct, color: e.target.value})} /></div>
                      <div><label className="text-sm font-medium text-gray-700 block mb-1">材質</label><input type="text" placeholder="如: 100% 純棉" className="w-full p-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" value={newProduct.material} onChange={e => setNewProduct({...newProduct, material: e.target.value})} /></div>
                    </div>
                    <div><label className="text-sm font-medium text-gray-700 block mb-1">圖片網址 (URL)</label><input type="url" placeholder="https://..." className="w-full p-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-mono" value={newProduct.imageUrl} onChange={e => setNewProduct({...newProduct, imageUrl: e.target.value})} /></div>
                    <div><label className="text-sm font-medium text-gray-700 block mb-1">特徵描述 (防偽重點)</label><textarea placeholder="領口有特殊縫線..." className="w-full p-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 resize-none" rows="3" value={newProduct.description} onChange={e => setNewProduct({...newProduct, description: e.target.value})}></textarea></div>
                  </form>
                </div>
                
                <div className="p-4 border-t border-gray-100 bg-gray-50 flex gap-3 sm:rounded-b-2xl">
                  <button onClick={() => setIsAdding(false)} className="flex-1 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-100 font-medium transition-colors">取消</button>
                  <button type="submit" form="addForm" disabled={isSubmitting} className="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 font-medium transition-colors disabled:opacity-50 flex justify-center items-center gap-2">{isSubmitting ? '儲存中...' : '儲存至雲端'}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>


```
